server:
  port: 8089
  servlet:
    context-path: /

spring:
  application:
    name: embed-file
  jackson:
    # Отключаем запись дат в виде таймстампов (чисел), чтобы Instant сериализовался в формате ISO-8601 (строка)
    serialization:
      write-dates-as-timestamps: false
    # Поддержка корректного часового пояса при парсинге дат
    deserialization:
      adjust-dates-to-context-time-zone: false

app:
  external-api:
    base-url: https://external.service

logging:
  config: classpath:logback.xml
  level:
    root: INFO
    ru.ruslan: DEBUG
    org.springframework.web: INFO
